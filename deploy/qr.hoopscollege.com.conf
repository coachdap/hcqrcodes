# Reverse-proxies qr.hoopscollege.com -> qrgen container on 127.0.0.1:3020
#
# Install on hc-new:
#   scp deploy/qr.hoopscollege.com.conf hc-new:/etc/apache2/sites-available/
#   ssh hc-new 'a2ensite qr.hoopscollege.com && apache2ctl configtest && systemctl reload apache2'
#
# TLS: the existing /etc/letsencrypt/live/hoopscollege.com certificate is a
# wildcard (*.hoopscollege.com), so qr. is already covered — no new cert needed.
#
# DNS: qr.hoopscollege.com must exist in Cloudflare pointing at 74.208.19.54.

<VirtualHost *:80>
    ServerName qr.hoopscollege.com

    RewriteEngine On
    RewriteRule ^ https://qr.hoopscollege.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin info@hoopscollege.com
    ServerName qr.hoopscollege.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/hoopscollege.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hoopscollege.com/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # mod_proxy_http sets X-Forwarded-For automatically. qrgen treats that header
    # as proof the request came from outside, so do NOT disable it — without it,
    # public requests would be classed as internal and skip the bearer token.

    # Base64 logos and batch requests can be large.
    LimitRequestBody 20971520

    ProxyPass        / http://127.0.0.1:3020/
    ProxyPassReverse / http://127.0.0.1:3020/

    ErrorLog  ${APACHE_LOG_DIR}/qr.hoopscollege.com-error.log
    CustomLog ${APACHE_LOG_DIR}/qr.hoopscollege.com-access.log combined
</VirtualHost>
</IfModule>
