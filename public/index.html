<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utilities · Hoops College</title>
<link rel="stylesheet" href="/ui/shared.css">
<style>
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .hero h1 { font-size: 26px; letter-spacing: -0.02em; }
  .hero .sub { font-size: 14.5px; max-width: 560px; }
  .find { width: min(320px, 100%); }
  .empty { margin-top: 30px; color: var(--muted); }
</style>
</head>
<body>
<main class="wrap" data-tool="home">
  <div class="hero">
    <div>
      <h1>Utilities</h1>
      <div class="sub">Everyday tools for Hoops College and Chase Excellence: QR codes, images, flyers, name tags, check-in, PDFs and video. Everything runs on our own server, and nothing is sent to outside services.</div>
    </div>
    <input type="text" class="find" id="find" placeholder="Find a tool…" aria-label="Find a tool" autocomplete="off">
  </div>
  <div id="groups"></div>
  <div class="empty" id="empty" hidden>No tool matches that. Try “photo”, “pdf” or “badge”.</div>
</main>

<script src="/ui/shared.js"></script>
<script>
(function () {
  const { $, TOOLS, icon, escapeHtml } = qrgenUI;

  // Extra words people search with that aren't in a tool's name or blurb.
  const KEYWORDS = {
    qr: 'wifi contact vcard scan code',
    links: 'utm tracking campaign analytics url',
    svg: 'vector logo crop webp png',
    convert: 'jpg jpeg png webp avif heic resize format',
    social: 'instagram facebook twitter x youtube tiktok story banner resize crop',
    compress: 'shrink smaller optimize gps exif privacy photo',
    favicon: 'icon website app apple touch manifest',
    flyer: 'poster graphic event camp tryouts print social',
    tags: 'badge label jersey bag avery roster sign-in sheet name',
    checkin: 'attendance scan door event camp scanner',
    pdf: 'merge combine split compress waiver scan pages images',
    video: 'mp4 gif clip highlight compress thumbnail mp3 audio',
    brand: 'logo colours colors fonts palette'
  };

  function render(query) {
    const q = query.trim().toLowerCase();
    let shown = 0;
    $('groups').innerHTML = TOOLS.map((g) => {
      const items = g.items.filter((t) => !q || `${t.name} ${t.desc} ${KEYWORDS[t.slug] || ''}`.toLowerCase().includes(q));
      shown += items.length;
      if (!items.length) return '';
      return `<section class="home-group"><h2>${escapeHtml(g.group)}</h2><div class="cards">` +
        items.map((t) => `<a class="card" href="/ui/${t.slug}"><span class="ico">${icon(t.icon)}</span><span><b>${escapeHtml(t.name)}</b><span>${escapeHtml(t.desc)}</span></span></a>`).join('') +
        '</div></section>';
    }).join('');
    $('empty').hidden = shown > 0;
  }

  $('find').addEventListener('input', (e) => render(e.target.value));
  $('find').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { const first = document.querySelector('.card'); if (first) location.href = first.href; }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement?.tagName !== 'INPUT') { e.preventDefault(); $('find').focus(); }
  });
  render('');
})();
</script>
</body>
</html>
